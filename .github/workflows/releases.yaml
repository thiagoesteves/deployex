name: Publishing Releases

on:
  push:
    tags:
      - "*"

env:
  MIX_ENV: prod
  SHELL: /usr/bin/bash

jobs:
  build:
    if: github.event.base_ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        otp: [28, 29]
    env:
      ARTIFACT_NAME: deployex-ubuntu-24.04-otp-${{ matrix.otp }}.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so we can build the previous release and let
          # Jellyfish generate the hot-upgrade appup into this release.
          fetch-depth: 0

      - name: Install libcap-dev [recommended by erlexec]
        run: sudo apt-get install libcap-dev -y

      - name: Copy .tool-versions
        run: cp devops/releases/otp-${{ matrix.otp }}/.tool-versions .

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # Mirror hot_upgrade.yaml: build the previous release, then build this tag
      # with --force in the same sequence, so Jellyfish sees the previous app
      # versions in the release lib and emits the relup/appup into this release.
      # First release (no previous tag) is a plain base build.
      - name: Compile and generate the release (with hot-upgrade appup)
        run: |
          TAG="${{ github.ref_name }}"
          PREV=$(git tag --sort=version:refname | awk -v cur="$TAG" '$0==cur{print prev} {prev=$0}')
          if [ -n "$PREV" ]; then
            echo "Previous release: $PREV — building $PREV then $TAG so $PREV -> $TAG carries an appup"
            git checkout --quiet "$PREV"
            cp devops/releases/otp-${{ matrix.otp }}/.tool-versions .
            mix do deps.get + compile
            mix assets.deploy
            mix release
            git checkout --quiet "$TAG"
            cp devops/releases/otp-${{ matrix.otp }}/.tool-versions .
            mix do deps.get + compile --force --warnings-as-errors
            mix assets.deploy
            mix release
          else
            echo "No previous tag; building $TAG as a base release (no appup)"
            mix do deps.get + compile --warnings-as-errors
            mix assets.deploy
            mix release
          fi

      - name: Rename Artifact
        # After the two-phase build _build/prod may also hold the previous
        # tarball; take the most recently built one (this tag's release).
        run: mv "$(ls -t _build/prod/deployex-*.tar.gz | head -1)" ${{ env.ARTIFACT_NAME }}

      - name: Calculate checksum
        run: sha256sum ${{ env.ARTIFACT_NAME }} > ${{ env.ARTIFACT_NAME }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_NAME }}
            ${{ env.ARTIFACT_NAME }}.sha256

  copyInstaller:
    if: github.event.base_ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Prepare installer and checksum
        run: |
          cp devops/installer/deployex.sh .
          sha256sum deployex.sh > deployex.sh.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: deployex.sh
          path: |
            deployex.sh
            deployex.sh.sha256

  copyChangelog:
    if: github.event.base_ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/upload-artifact@v4
        with:
          name: CHANGELOG.md
          path: CHANGELOG.md

  createRelease:
    if: github.event.base_ref == 'refs/heads/main'
    name: Publish artifacts to the release
    needs: [build, copyInstaller, copyChangelog]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create checksums file
        run: cat *.sha256 > checksum.txt

      - name: Release the files
        uses: ncipollo/release-action@v1
        with:
          artifacts: "deployex-ubuntu-24.04-otp-*.tar.gz, deployex.sh, checksum.txt"
          bodyFile: "CHANGELOG.md"
